repositories:
- name: prometheus-community
  url: https://prometheus-community.github.io/helm-charts
- name: argoproj
  url: https://argoproj.github.io/argo-helm
- name: strrl.dev
  url: https://helm.strrl.dev
- name: grafana
  url: https://grafana.github.io/helm-charts
- name: metrics-server
  url: https://kubernetes-sigs.github.io/metrics-server/
- name: bitnami
  url: https://charts.bitnami.com/bitnami
- name: hashicorp
  url: https://helm.releases.hashicorp.com
- name: external-secrets
  url: https://charts.external-secrets.io
- name: kyverno
  url: https://kyverno.github.io/kyverno/
- name: falcosecurity
  url: https://falcosecurity.github.io/charts
- name: aquasecurity
  url: https://aquasecurity.github.io/helm-charts/

---
environments:
  dev:
    values:
      - clusterName: dev
        domain: bls.dev
        environment: dev
        argocd:
          adminpasswordhashed: "$2a$10$R9h7cIPooruNMMwq.L7KqOOtV27x8BwwfHuPVnKfKWGz/BnQuZ8eC"
          notifications:
            enabled: false
        github:
          accesstoken: "changeme"
        cloudflare:
          apitoken: "changeme"
          accountid: "changeme"
        cloudflared:
          replicaCount: 1
        # External Vault configuration for secrets management
        externalVault:
          server: "https://vault.example.com"  # Change to your external Vault URL
          path: "secret"  # KV v2 path in Vault
          version: "v2"  # Vault KV version
          authPath: "kubernetes"  # Auth method path in Vault
          authRole: "default"  # Kubernetes auth role in Vault
        # Grafana Cloud configuration for observability
        grafanaCloud:
          username: "changeme"  # Grafana Cloud instance username
          prometheusUrl: "https://prometheus-blocks-prod-us-central1.grafana.net/api/prom/push"
          prometheusPassword: "changeme"  # API token from Grafana Cloud
          lokiUrl: "https://logs-prod-us-central1.grafana.net/loki/api/v1/push"
          lokiPassword: "changeme"  # API token from Grafana Cloud
          tempoUrl: "https://tempo-blocks-prod-us-central1.grafana.net:443"
          tempoPassword: "changeme"  # API token from Grafana Cloud
        # Agent configuration
        agent:
          logLevel: "info"

  staging:
