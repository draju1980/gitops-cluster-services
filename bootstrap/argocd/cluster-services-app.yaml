---
# Example ArgoCD Application for deploying cluster services with Vault integration
# This application uses the helmfile plugin to deploy all cluster services
#
# Prerequisites:
# 1. Run: bootstrap/setup-vault-integration.sh
# 2. Ensure Vault secrets exist at: secret/gitops/{ENVIRONMENT}/grafana-cloud
# 3. Update the values below for your environment
#
# To deploy:
# kubectl apply -f bootstrap/argocd/cluster-services-app.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-services
  namespace: argo-cd
spec:
  # Project reference
  project: default

  # Source repository and helmfile configuration
  source:
    repoURL: https://github.com/draju1980/gitops-cluster-services
    targetRevision: main
    path: .

    # Helmfile plugin configuration
    plugin:
      name: helmfile
      env:
        # Cluster identification
        - name: CLUSTER_NAME
          value: dev-cluster

        - name: CLUSTER_DOMAIN
          value: example.com

        - name: ENVIRONMENT
          value: dev

        # GitHub token for private repository access
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: argocd-bootstrap-secrets
              key: github-token

        # Cloudflare integration (optional)
        - name: CLOUDFLARE_TOKEN
          valueFrom:
            secretKeyRef:
              name: argocd-bootstrap-secrets
              key: cloudflare-token

        - name: CLOUDFLARE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: argocd-bootstrap-secrets
              key: cloudflare-account-id

        # ArgoCD admin password hash (bcrypt)
        - name: ARGOCD_ADMIN_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: argocd-bootstrap-secrets
              key: argocd-admin-password-hash

        # Vault configuration (for external secret management)
        - name: VAULT_ADDR
          valueFrom:
            secretKeyRef:
              name: argocd-vault-config
              key: vault-addr

        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: argocd-vault-config
              key: vault-token

  # Destination cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  # Sync policy configuration
  syncPolicy:
    # Automatically sync when changes are detected
    automated:
      prune: true
      selfHeal: true

    # Sync options
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

    # Retry configuration
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Allow to manage cluster admin resources
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle

---
# ArgoCD AppProject for cluster services
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-services
  namespace: argo-cd
spec:
  description: "Cluster services and infrastructure"

  # Allow source repositories
  sourceRepos:
    - 'https://github.com/draju1980/*'
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://argoproj.github.io/argo-helm'
    - 'https://helm.strrl.dev'
    - 'https://grafana.github.io/helm-charts'
    - 'https://kubernetes-sigs.github.io/metrics-server/'
    - 'https://charts.bitnami.com/bitnami'
    - 'https://helm.releases.hashicorp.com'
    - 'https://charts.external-secrets.io'
    - 'https://kyverno.github.io/kyverno/'
    - 'https://falcosecurity.github.io/charts'
    - 'https://aquasecurity.github.io/helm-charts/'

  # Allow deployment to all namespaces in destination cluster
  destinations:
    - namespace: '*'
      server: '*'

  # Allow to create any resource
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  # Allow external secret management
  clusterResourceBlacklist: []
  namespaceResourceBlacklist: []

---
# Secret containing bootstrap credentials
# Note: In production, use sealed-secrets or external-secrets for credential management
apiVersion: v1
kind: Secret
metadata:
  name: argocd-bootstrap-secrets
  namespace: argo-cd
type: Opaque
stringData:
  # GitHub personal access token (for private repos)
  github-token: "ghp_your-github-token-here"

  # Cloudflare API token
  cloudflare-token: "your-cloudflare-api-token"
  cloudflare-account-id: "your-cloudflare-account-id"

  # ArgoCD admin password hash (generate with: htpasswd -b admin password | tr -d '\n' | xargs -I {} echo -n '{}' | md5sum)
  # Use: htpasswd -bc /tmp/pass admin mypassword && cat /tmp/pass | cut -d: -f2
  argocd-admin-password-hash: "$2a$10$R9h7cIPooruNMMwq.L7KqOOtV27x8BwwfHuPVnKfKWGz/BnQuZ8eC"

---
# Vault configuration secret (created by setup-vault-integration.sh)
# This is referenced by the helmfile plugin to access Vault
apiVersion: v1
kind: Secret
metadata:
  name: argocd-vault-config
  namespace: argo-cd
type: Opaque
stringData:
  # External Vault server URL
  vault-addr: "http://vault.example.com:8200"

  # Vault authentication token (for helmfile plugin)
  # In production, use Kubernetes auth or JWT auth instead of static tokens
  vault-token: "hvs.your-vault-token-here"
