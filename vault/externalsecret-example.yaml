# Example: How to sync secrets from Vault using External Secrets Operator
#
# 1. First, store your secret in Vault:
#    vault kv put secret/myapp/database \
#      username=admin \
#      password=mysecretpassword \
#      connection-string="postgresql://admin:mysecretpassword@db:5432/mydb"
#
# 2. Create an ExternalSecret resource (example below)
#
# 3. External Secrets Operator will automatically:
#    - Read from Vault
#    - Create a Secret in the same namespace
#    - Keep it in sync
#    - Refresh every 15 minutes (configurable)

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: default  # Change to your application namespace
spec:
  # Refresh interval
  refreshInterval: 15m

  # Reference the ClusterSecretStore we created
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore

  # Target secret to create in this namespace
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Map Vault secret keys to the target secret
        username: "{{ .username }}"
        password: "{{ .password }}"
        connection-string: "{{ .connection-string }}"

  # Data to sync from Vault
  data:
    # Extract individual keys from Vault secret
    - secretKey: username
      remoteRef:
        key: myapp/database
        property: username

    - secretKey: password
      remoteRef:
        key: myapp/database
        property: password

    - secretKey: connection-string
      remoteRef:
        key: myapp/database
        property: connection-string

---
# Example: How to use the synced secret in a Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: myapp:latest

        # Method 1: Mount as environment variables
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: password
        - name: DB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: connection-string

        # Method 2: Mount as files in volume
        volumeMounts:
        - name: db-credentials
          mountPath: /etc/secrets/database
          readOnly: true

      volumes:
      - name: db-credentials
        secret:
          secretName: database-credentials

---
# Example: Vault policy needed for your application
# Add this to your Vault policies:
#
# vault policy write myapp - <<EOF
# path "secret/data/myapp/*" {
#   capabilities = ["read", "list"]
# }
# EOF
#
# vault write auth/kubernetes/role/myapp-sa \
#   bound_service_account_names=myapp-sa \
#   bound_service_account_namespaces=default \
#   policies=myapp \
#   ttl=24h
