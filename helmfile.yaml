  url: https://falcosecurity.github.io/charts
- name: aquasecurity
  url: https://aquasecurity.github.io/helm-charts/

---
# Environment-agnostic Helmfile
# Deploy cluster services to any Kubernetes cluster by passing environment variables
#
# Required environment variables:
#   CLUSTER_NAME           - Unique cluster identifier (dev, staging, prod, etc)
#   CLUSTER_DOMAIN         - Domain for cluster services (e.g., example.com)
#   GITHUB_TOKEN           - GitHub personal access token for git operations
#   CLOUDFLARE_TOKEN       - Cloudflare API token for DNS and tunnel
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account ID
#   ARGOCD_ADMIN_PASSWORD_HASH - bcrypt hash of ArgoCD admin password
#
# Optional environment variables:
#   CLOUDFLARED_REPLICAS       - Number of cloudflared replicas (default: 1)
#   EXTERNAL_VAULT_SERVER      - External Vault server URL
#   EXTERNAL_VAULT_PATH        - Vault KV path (default: secret)
#   EXTERNAL_VAULT_AUTH_PATH   - Vault auth method path (default: kubernetes)
#   EXTERNAL_VAULT_AUTH_ROLE   - Vault Kubernetes auth role (default: default)
#   GRAFANA_CLOUD_USERNAME     - Grafana Cloud username/email
#   GRAFANA_CLOUD_PROM_URL     - Grafana Cloud Prometheus push URL
#   GRAFANA_CLOUD_PROM_PASSWORD - Grafana Cloud Prometheus API token
#   GRAFANA_CLOUD_LOKI_URL     - Grafana Cloud Loki push URL
#   GRAFANA_CLOUD_LOKI_PASSWORD - Grafana Cloud Loki API token
#   GRAFANA_CLOUD_TEMPO_URL    - Grafana Cloud Tempo URL (optional)
#   GRAFANA_CLOUD_TEMPO_PASSWORD - Grafana Cloud Tempo API token (optional)
#   AGENT_LOG_LEVEL            - Grafana Agent log level (default: info)

environments:
  default:
    values:
      - clusterName: {{ env "CLUSTER_NAME" | default "default" }}
        domain: {{ env "CLUSTER_DOMAIN" | default "example.com" }}
        environment: {{ env "CLUSTER_NAME" | default "default" }}
        argocd:
          adminpasswordhashed: {{ env "ARGOCD_ADMIN_PASSWORD_HASH" | default "$2a$10$R9h7cIPooruNMMwq.L7KqOOtV27x8BwwfHuPVnKfKWGz/BnQuZ8eC" }}
          notifications:
            enabled: false
        github:
          accesstoken: {{ env "GITHUB_TOKEN" | default "changeme" }}
        cloudflare:
          apitoken: {{ env "CLOUDFLARE_TOKEN" | default "changeme" }}
          accountid: {{ env "CLOUDFLARE_ACCOUNT_ID" | default "changeme" }}
        cloudflared:
          replicaCount: {{ env "CLOUDFLARED_REPLICAS" | default "1" | atoi }}
        externalVault:
          server: {{ env "EXTERNAL_VAULT_SERVER" | default "https://vault.example.com" }}
          path: {{ env "EXTERNAL_VAULT_PATH" | default "secret" }}
          version: v2
          authPath: {{ env "EXTERNAL_VAULT_AUTH_PATH" | default "kubernetes" }}
          authRole: {{ env "EXTERNAL_VAULT_AUTH_ROLE" | default "default" }}
        grafanaCloud:
          username: {{ env "GRAFANA_CLOUD_USERNAME" | default "changeme" }}
          prometheusUrl: {{ env "GRAFANA_CLOUD_PROM_URL" | default "https://prometheus-blocks-prod-us-central1.grafana.net/api/prom/push" }}
          prometheusPassword: {{ env "GRAFANA_CLOUD_PROM_PASSWORD" | default "changeme" }}
          lokiUrl: {{ env "GRAFANA_CLOUD_LOKI_URL" | default "https://logs-prod-us-central1.grafana.net/loki/api/v1/push" }}
          lokiPassword: {{ env "GRAFANA_CLOUD_LOKI_PASSWORD" | default "changeme" }}
          tempoUrl: {{ env "GRAFANA_CLOUD_TEMPO_URL" | default "https://tempo-blocks-prod-us-central1.grafana.net:443" }}
          tempoPassword: {{ env "GRAFANA_CLOUD_TEMPO_PASSWORD" | default "changeme" }}
        agent:
          logLevel: {{ env "AGENT_LOG_LEVEL" | default "info" }}

---
helmfiles:
  - path: releases/namespaces.yaml.gotmpl
    values:
      - {{ .Values | toYaml | nindent 8 }}
  - path: releases/vault.yaml.gotmpl
    values:
      - {{ .Values | toYaml | nindent 8 }}
  - path: releases/ingress.yaml.gotmpl
    values:
      - {{ .Values | toYaml | nindent 8 }}
  - path: releases/observability.yaml.gotmpl
    values:
      - {{ .Values | toYaml | nindent 8 }}
  - path: releases/networking.yaml.gotmpl
    values:
      - {{ .Values | toYaml | nindent 8 }}
  - path: releases/argocd.yaml.gotmpl
    values:
      - {{ .Values | toYaml | nindent 8 }}
