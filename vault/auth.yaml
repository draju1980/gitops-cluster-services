apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-kubernetes-auth
  namespace: vault
data:
  setup-auth.sh: |
    #!/bin/bash
    set -e

    # Wait for Vault to be ready
    echo "Waiting for Vault to be unsealed..."
    until vault status &>/dev/null; do
      sleep 5
    done

    # Enable Kubernetes auth method (if not already enabled)
    vault auth list | grep -q "^kubernetes/" || \
      vault auth enable kubernetes

    # Configure Kubernetes auth
    vault write auth/kubernetes/config \
      kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
      kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
      token_reviewer_jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token

    # Create policy for external-secrets operator
    vault policy write external-secrets - <<'EOF'
    # Policy for External Secrets Operator
    path "secret/data/*" {
      capabilities = ["read", "list"]
    }
    path "secret/metadata/*" {
      capabilities = ["read", "list"]
    }
    EOF

    # Create Kubernetes auth role for external-secrets
    vault write auth/kubernetes/role/external-secrets \
      bound_service_account_names=external-secrets \
      bound_service_account_namespaces=external-secrets \
      policies=external-secrets \
      ttl=24h

    echo "Kubernetes auth method configured successfully"
    echo "Service account external-secrets can now authenticate to Vault"
