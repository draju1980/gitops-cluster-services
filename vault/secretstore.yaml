apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
  namespace: external-secrets
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"

      # Kubernetes authentication method
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"

          # Service account token (automatically mounted)
          serviceAccountRef:
            name: external-secrets
---
# Optional: Namespace-scoped SecretStore example for individual namespaces
# Copy this to each namespace that needs access to Vault secrets
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: default  # Change to your namespace
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
